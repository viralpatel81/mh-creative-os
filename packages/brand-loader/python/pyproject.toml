[project]
name = "brand-loader"
version = "0.1.0"
description = "Unified brand profile loader (Python)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brand_loader"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
