[project]
name = "mh-protocols"
version = "0.1.0"
description = "JSON Schema validators for mh-creative-os workflow contracts."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mh_protocols"]

[dependency-groups]
dev = ["pytest>=8.0"]
